name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request: {}

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        go:
        - '1.23.8'
        - '1.24.2'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: >-
          WORKAROUND: Fetch tags that points to the revisions
          checked-out(actions/checkout#1467)
        run: |-
          git fetch --tags --force

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: make cross
      - name: Upload macadam artifact
        if: matrix.go == '1.23.8'
        uses: actions/upload-artifact@v4
        with:
          name: macadam binaries
          path: "./bin/*"

  e2e:
    needs: build
    strategy:
      matrix:
        os:
        - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      CONTAINERS_HELPER_BINARY_DIR: ${{ github.workspace }}/tools
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies (including openssh-server)
        run: |
          sudo apt update && sudo apt install -y openssh-server

      - name: Create SSH Directory and Set Permissions
        run: |
          sudo mkdir -p /home/runner/.ssh
          sudo chown -R runner:runner /home/runner/.ssh
          sudo chmod 700 /home/runner/.ssh

      - name: Add SSH Public Key to authorized_keys
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/authorized_keys
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macadam binaries
          path: ./bin
      - name: Install qemu-img (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y qemu-kvm
          sudo usermod -a -G kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download gvproxy
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/containers/gvisor-tap-vsock/releases/download/v0.8.5/gvproxy-linux-amd64 -O ${{ github.workspace }}/tools/gvproxy
          chmod +x ${{ github.workspace }}/tools/gvproxy
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'oldstable'
      - name: Grant execute permissions
        if: runner.os == 'Linux'
        run: |
          chmod +x ./bin/*
      - name: Log Environment Variables
        run: |
          env
      - name: Log Current User
        run: |
          whoami
      - name: List Artifact Contents
        run: |
          ls -l /run
          ls -l /run/user
          ls -l /run/user/1001
      - name: Print Current Working Directory
        run: pwd
      - name: Test
        continue-on-error: true
        run: make e2e
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENTID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:actions
      - name: Keep Alive
        run: sleep 7200
